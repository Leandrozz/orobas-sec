# CI del repositorio público: sólo runners de GitHub, sin secretos y con permisos de lectura.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pruebas:
    runs-on: ubuntu-latest
    # La suite completa tarda unos minutos: si algo se cuelga, que falle rápido en vez de agotar el tope.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 26
      - run: npm ci
      - run: npm run typecheck
      - name: Pruebas
        # Varias pruebas comparan textos de la interfaz en castellano. Ninguna habla con servicios reales:
        # la dirección del servicio apunta a un puerto cerrado.
        env:
          LANG: es_AR.UTF-8
          OROBAS_BASE_URL: http://127.0.0.1:9/api/v1
        run: npm test
